services:

  swag:
    image: linuxserver/swag:5.7.0
    ports:
      - "${http_p:-80}:80"
      - "${https_p:-443}:443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - URL=${domain}
      - SUBDOMAINS=
      - VALIDATION=http
      - DOCKER_MODS=ghcr.io/linuxserver/mods:swag-crowdsec
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
      - CROWDSEC_LAPI_URL=http://crowdsec:8080
    volumes:
      - ./nginx/html:/config/www
      - ./nginx/conf.d/nginx.conf.tpl:/defaults/nginx/site-confs/default.conf:ro
      - ./swag/config:/config
      - ./nginx/logs:/config/log/nginx
    restart: unless-stopped

  crowdsec:
    image: crowdsecurity/crowdsec@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    environment:
      - GID=1000
      - BOUNCER_KEY_SWAG=${CROWDSEC_API_KEY}
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
    volumes:
      - ./crowdsec/data:/var/lib/crowdsec/data/
      - ./nginx/logs:/var/log/swag:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    ports:
      - "${nginx_exporter_p:-9113}:9113"
    command:
      - -nginx.scrape-uri=http://swag:8080/metrics
    depends_on:
      - swag
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    ports:
      - "${blackbox_exporter_p:-9115}:9115"
    depends_on:
      - swag
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "${node_exporter_p:-9100}:9100"
    volumes:
      - '/:/host:ro'
    command:
      - '--path.rootfs=/host'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.0
    ports:
      - "${prometheus_p:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      - ./prometheus/data:/prometheus/data
    user: "1000:1000"
    environment:
      - domain=${domain}
    entrypoint: /bin/sh
    command: -c "sed 's/\\$${domain}/'$$domain'/g' /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus-$${prometheus_suffix}.yml && /bin/prometheus --config.file=/tmp/prometheus-$${prometheus_suffix}.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "${grafana_p:-3000}:3000"
    user: "1000:1000"
    environment:
      - GF_SECURITY_ADMIN_USER=${grafana_login}
      - GF_SECURITY_ADMIN_PASSWORD=${grafana_password}
    volumes:
      - ./grafana/grafana.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/data:/var/lib/grafana
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.3
    ports:
      - "${loki_p:-3100}:3100"
    user: "1000:1000"
    volumes:
      - ./loki/data:/loki
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.11
    volumes:
      - ./nginx/logs:/var/log/nginx:ro
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log/host:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_pass}
      POSTGRES_DB: ${db_name}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "${postgres_p:-5432}:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-app}:${DB_PASS:-secret}@postgres:5432/${DB_NAME:-appdb}?sslmode=disable"
    ports:
      - "${postgres_exporter_p:-9187}:9187"
    depends_on:
      - postgres
    restart: unless-stopped